<!doctype html>
<html lang="en" dir="ltr" class="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Lance — find work from every site, hire at a fair price, learn from zero, and hand routine work to seven agents. In English and Persian." />
    <title>Lance</title>
    <script>
      // Apply the saved theme and language direction before first paint (no flash).
      try {
        var t = localStorage.getItem('lance:theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night');
        document.documentElement.className = t;
        if (location.pathname.indexOf('/fa') === 0) { document.documentElement.lang = 'fa'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
